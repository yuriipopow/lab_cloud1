x-app-env: &app-env
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: appdb
  DB_USER: appuser
  DB_PASSWORD: ${DB_PASSWORD:?Скопіюйте .env.example у .env}
  REDIS_URL: redis://redis:6379
  # Локальна SQS-сумісна черга (ElasticMQ). Ключі фіктивні: ElasticMQ їх не перевіряє.
  SQS_ENDPOINT: http://elasticmq:9324
  SQS_QUEUE_NAME: notes-writes
  AWS_REGION: elasticmq
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Скопіюйте .env.example у .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт бази назовні не публікується: застосунок звертається до неї
    # всередині мережі compose за іменем сервісу db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    restart: always

  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: always
    environment:
      <<: *app-env
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?}
      CACHE_ENABLED: "${CACHE_ENABLED:-true}"
      CACHE_TTL_SECONDS: 30
      WRITE_MODE: "${WRITE_MODE:-queue}"
    ports:
      - "3000:3000"
    # depends_on сам лише впорядковує старт; condition: service_healthy
    # змушує чекати, доки база справді приймає з'єднання
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticmq:
        condition: service_started

  # Обробник черги: той самий образ, інша команда
  worker:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: always
    command: ["node", "src/worker.js"]
    environment:
      <<: *app-env
      WORKER_PROCESS_MS: 150
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticmq:
        condition: service_started

volumes:
  pgdata:
